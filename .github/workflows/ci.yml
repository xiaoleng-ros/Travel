name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: 前端 · 测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 单元测试
        run: npm test

      - name: 构建产物
        run: npm run build

      - name: 云函数语法检查
        run: |
          node --check "cloud-functions/api/[[default]].js"
          node --check scripts/dev-server.mjs

  server:
    name: 后端 · 测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # 测试不触碰真实数据库，此值仅用于满足模块加载时的密钥长度校验
      JWT_SECRET: ci-placeholder-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 单元测试
        run: npm test
